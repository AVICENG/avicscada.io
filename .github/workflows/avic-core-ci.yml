name: AVIC Core CI

on:
  # Public repository: standard GitHub-hosted runners are free.
  # Pull requests are tested on both Linux and Windows.
  push:
    branches:
      - main
      - dev112-station-transfer-reliability
      - dev183-linux-cli-test-fix
      - drivers/c-only-cleanup-dev246
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

# One workflow run at a time across this repository.
# Keep the active matrix running; newer commits replace only the pending run.
# Matrix jobs inside the active run are capped at 20.
concurrency:
  group: avic-core-ci-global

jobs:
  test-matrix:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        os: [ubuntu-latest, windows-2025]
        python-version: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        working-directory: AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111/pyproject.toml

      - name: Install AVIC Core and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile package
        run: python -m compileall -q avic_core

      - name: Prepare test report directory
        run: python -c "from pathlib import Path; Path('test-results').mkdir(exist_ok=True)"

      - name: Run full test suite
        run: python -m pytest -q -rs --junitxml=test-results/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avic-test-report-${{ runner.os }}-py${{ matrix.python-version }}
          path: AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111/test-results/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  rust-communication-pilot:
    name: Rust Communication Engine / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    defaults:
      run:
        working-directory: AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python for comparative benchmark
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AVIC Core
        run: python -m pip install -e .

      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/avic-communication-engine/Cargo.toml

      - name: Run same-simulator Python vs Rust Modbus benchmark (10,000 points)
        run: python tools/modbus_load_compare.py --devices 100 --points-per-device 100 --cycles 10 --concurrency 16

      - name: Run Python BACnet/IP ReadProperty baseline (10,000 points)
        run: python tools/bacnet_load_baseline.py --points 10000

  c-libmodbus-worker-linux:
    name: C libmodbus Worker / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install C build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libmodbus-dev libjansson-dev uuid-dev

      - name: Configure C Worker
        run: cmake -S rust/avic-communication-engine/c-worker -B build/c-modbus-worker -DCMAKE_BUILD_TYPE=Release

      - name: Build C Worker
        run: cmake --build build/c-modbus-worker --config Release --parallel 2

      - name: Set up Python for IPC smoke test
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AVIC Core test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run compiled C Worker IPC handshake test
        env:
          AVIC_C_MODBUS_WORKER: ${{ github.workspace }}/AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111/build/c-modbus-worker/avic-modbus-c-worker
        run: python -m pytest -q tests/test_c_modbus_worker_dev223.py

  c-libmodbus-worker-windows:
    name: C libmodbus Worker / Windows UCRT64
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        working-directory: AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MSYS2 UCRT64 C dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libmodbus
            mingw-w64-ucrt-x86_64-jansson

      - name: Configure Windows C Worker
        shell: msys2 {0}
        run: cmake -S rust/avic-communication-engine/c-worker -B build/c-modbus-worker -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Windows C Worker
        shell: msys2 {0}
        run: cmake --build build/c-modbus-worker --parallel 2

      - name: Inspect Windows C Worker runtime dependencies
        shell: pwsh
        run: |
          $worker = "build/c-modbus-worker/avic-modbus-c-worker.exe"
          if (-not (Test-Path $worker)) { throw "C Worker executable was not produced" }
          # Use the exact MSYS2 installation used by the compiler. Get-Command
          # can resolve the runner's unrelated C:\\mingw64 installation.
          $msysBin = Join-Path $env:RUNNER_TEMP "msys64\\ucrt64\\bin"
          $objdump = Join-Path $msysBin "objdump.exe"
          if (-not (Test-Path $objdump)) { throw "UCRT64 objdump not found: $objdump" }
          & $objdump -p $worker | Select-String "DLL Name"
          if ($LASTEXITCODE -ne 0) { throw "objdump failed to inspect C Worker" }
          "MSYS2 UCRT64 runtime bin: $msysBin" | Write-Host

      - name: Set up Python for Windows IPC and protocol acceptance
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AVIC Core test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run compiled Windows C Worker IPC and Modbus simulator tests
        shell: pwsh
        env:
          AVIC_C_MODBUS_WORKER: ${{ github.workspace }}\AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111\build\c-modbus-worker\avic-modbus-c-worker.exe
        run: |
          $msysBin = Join-Path $env:RUNNER_TEMP "msys64\\ucrt64\\bin"
          if (-not (Test-Path (Join-Path $msysBin "libmodbus-5.dll"))) {
            throw "UCRT64 libmodbus runtime DLL not found: $msysBin"
          }
          if (-not (Test-Path (Join-Path $msysBin "libjansson-4.dll"))) {
            throw "UCRT64 jansson runtime DLL not found: $msysBin"
          }
          $env:PATH = "$msysBin;$env:PATH"
          python -m pytest -q tests/test_c_modbus_worker_dev223.py

  bacnet-stack-build:
    name: BACnet Stack POC / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    defaults:
      run:
        working-directory: AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure pinned Steve Karg BACnet Stack
        run: cmake -S rust/avic-communication-engine/bacnet-stack-probe -B build/bacnet-stack-probe -DCMAKE_BUILD_TYPE=Release

      - name: Build BACnet Stack and AVIC probe
        run: cmake --build build/bacnet-stack-probe --config Release --parallel 2

      - name: Run BACnet Stack codec probe tests
        run: ctest --test-dir build/bacnet-stack-probe --build-config Release --output-on-failure

      - name: Set up Python for BACnet simulator integration
        if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build upstream Steve Karg BACnet/IP server simulator
        if: runner.os == 'Linux'
        run: make -C build/bacnet-stack-probe/_deps/bacnet_stack-src/apps BACDL=bip server.all

      - name: Test AVIC ReadProperty ACK and Error against upstream simulator
        if: runner.os == 'Linux'
        run: >-
          python tools/bacnet_stack_server_integration.py
          --server build/bacnet-stack-probe/_deps/bacnet_stack-src/bin/bacserv
          --probe build/bacnet-stack-probe/avic-bacnet-stack-probe

  paho-mqtt-c-native-probe:
    name: Eclipse Paho MQTT C native probe / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    defaults:
      run:
        working-directory: AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure pinned Eclipse Paho MQTT C
        run: cmake -S rust/avic-communication-engine/mqtt-paho-c-probe -B build/mqtt-paho-c-probe -DCMAKE_BUILD_TYPE=Release
      - name: Build Paho async C probe
        run: cmake --build build/mqtt-paho-c-probe --config Release --parallel 2
      - name: Run Paho async lifecycle self-test
        run: ctest --test-dir build/mqtt-paho-c-probe -C Release --output-on-failure

  mqtt-paho-c-worker-linux:
    name: Paho MQTT C Worker / Ubuntu Mosquitto
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native dependencies and Mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libjansson-dev uuid-dev mosquitto mosquitto-clients
      - name: Configure Paho MQTT C Worker
        run: cmake -S rust/avic-communication-engine/mqtt-c-worker -B build/mqtt-c-worker -DCMAKE_BUILD_TYPE=Release
      - name: Build Paho MQTT C Worker
        run: cmake --build build/mqtt-c-worker --config Release --parallel 2
      - name: Install AVIC Core test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Start isolated Mosquitto broker
        run: |
          config="$GITHUB_WORKSPACE/.avic-mosquitto-ci.conf"
          log="$GITHUB_WORKSPACE/avic-mosquitto-ci.log"
          cat > "$config" <<'AVIC_MOSQUITTO_EOF'
          listener 18883 127.0.0.1
          allow_anonymous true
          persistence false
          AVIC_MOSQUITTO_EOF
          chmod 644 "$config"
          test -r "$config"
          cat "$config"
          mosquitto -c "$config" -v > "$log" 2>&1 &
          broker_pid=$!
          for i in $(seq 1 30); do
            if ! kill -0 "$broker_pid" 2>/dev/null; then cat "$log"; exit 1; fi
            if mosquitto_pub -h 127.0.0.1 -p 18883 -t avic/ci/ready -m ready; then
              echo "Mosquitto ready: pid=$broker_pid"
              exit 0
            fi
            sleep 1
          done
          cat "$log"
          exit 1
      - name: Run MQTT C Worker IPC and broker round-trip tests
        env:
          AVIC_MQTT_C_WORKER: ${{ github.workspace }}/AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111/build/mqtt-c-worker/avic-mqtt-paho-c-worker
          AVIC_MQTT_C_BROKER_TEST: "1"
          AVIC_MQTT_BROKER_LOG: ${{ github.workspace }}/avic-mosquitto-ci.log
        run: python -m pytest -q tests/test_mqtt_c_worker_dev267.py

  mqtt-paho-c-worker-windows:
    name: Paho MQTT C Worker / Windows MSVC
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        working-directory: AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Paho MQTT C Worker with MSVC
        run: cmake -S rust/avic-communication-engine/mqtt-c-worker -B build/mqtt-c-worker -A x64
      - name: Build Paho MQTT C Worker
        run: cmake --build build/mqtt-c-worker --config Release --parallel 2
      - name: Install AVIC Core test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install pinned Mosquitto broker and clients
        shell: pwsh
        run: |
          $version = "2.1.4"
          $installer = Join-Path $env:RUNNER_TEMP "mosquitto-$version-install-windows-x64.exe"
          $url = "https://mosquitto.org/files/binary/win64/mosquitto-$version-install-windows-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actualHash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash
          $expectedHash = "034017C8F8E3B5B86BDBD971F6C5184370311058E4DE7B96A0F10204BBB9E7C8"
          if ($actualHash -ne $expectedHash) { throw "Mosquitto installer SHA256 mismatch: $actualHash" }
          $install = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Mosquitto installer failed with exit code $($install.ExitCode)" }
      - name: Start isolated Mosquitto broker
        shell: pwsh
        run: |
          $mosquittoDir = Join-Path $env:ProgramFiles "mosquitto"
          $mosquitto = Join-Path $mosquittoDir "mosquitto.exe"
          $publisher = Join-Path $mosquittoDir "mosquitto_pub.exe"
          Add-Content -Path $env:GITHUB_PATH -Value $mosquittoDir
          if (!(Test-Path $mosquitto) -or !(Test-Path $publisher)) {
            throw "Mosquitto executable or mosquitto_pub.exe was not installed at $mosquittoDir"
          }
          $config = Join-Path $env:RUNNER_TEMP "avic-mosquitto.conf"
          @("listener 18883 127.0.0.1", "allow_anonymous true", "persistence false") |
            Set-Content -Path $config -Encoding ascii
          Start-Process -FilePath $mosquitto -ArgumentList @("-c", $config, "-v") -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput "$env:RUNNER_TEMP\avic-mosquitto.log" `
            -RedirectStandardError "$env:RUNNER_TEMP\avic-mosquitto.err"
          for ($i = 0; $i -lt 30; $i++) {
            & $publisher -h 127.0.0.1 -p 18883 -t avic/ci/ready -m ready 2>$null
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 1
          }
          Get-Content "$env:RUNNER_TEMP\avic-mosquitto.log" -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP\avic-mosquitto.err" -ErrorAction SilentlyContinue
          throw "Mosquitto broker did not become ready"
      - name: Run MQTT C Worker IPC and broker round-trip tests
        shell: pwsh
        env:
          AVIC_MQTT_C_WORKER: ${{ github.workspace }}\AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111\build\mqtt-c-worker\Release\avic-mqtt-paho-c-worker.exe
          AVIC_MQTT_C_BROKER_TEST: "1"
          AVIC_MQTT_BROKER_LOG: ${{ runner.temp }}\avic-mosquitto.log
        run: python -m pytest -q tests/test_mqtt_c_worker_dev267.py

  opcua-open62541-native-probe:
    name: OPC UA open62541 native probe / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libmbedtls-dev
      - name: Configure open62541 with Mbed TLS
        run: cmake -S rust/avic-communication-engine/opcua-native-probe -B build/opcua-native-probe -DCMAKE_BUILD_TYPE=Release
      - name: Build native OPC UA probe
        run: cmake --build build/opcua-native-probe --config Release --parallel 2
      - name: Run NodeId self-tests
        run: ctest --test-dir build/opcua-native-probe -C Release --output-on-failure

  opcua-open62541-native-probe-windows:
    name: OPC UA open62541 native probe / Windows UCRT64
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install MSYS2 UCRT64 native dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-git
            mingw-w64-ucrt-x86_64-mbedtls
      - name: Configure open62541 with Mbed TLS
        shell: msys2 {0}
        run: cmake -S rust/avic-communication-engine/opcua-native-probe -B build/opcua-native-probe -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build native OPC UA probe
        shell: msys2 {0}
        run: cmake --build build/opcua-native-probe --parallel 2
      - name: Run NodeId self-tests
        shell: msys2 {0}
        run: ctest --test-dir build/opcua-native-probe --output-on-failure

  siemens-s7-c-policy:
    name: Siemens S7 C-only policy / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install AVIC Core without protocol-specific Python S7 packages
        run: python -m pip install -e ".[dev]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Verify S7 remains disabled until native C Worker acceptance
        run: python -m pytest -q tests/test_s7_dependencies_dev226.py
