name: AVIC Core CI

on:
  # Public repository: standard GitHub-hosted runners are free.
  # Pull requests are tested on both Linux and Windows.
  push:
    branches:
      - main
      - dev112-station-transfer-reliability
      - dev183-linux-cli-test-fix
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

# One workflow run at a time across this repository.
# Keep the active matrix running; newer commits replace only the pending run.
# Matrix jobs inside the active run are capped at 20.
concurrency:
  group: avic-core-ci-global

jobs:
  test-matrix:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        os: [ubuntu-latest, windows-2025]
        python-version: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        working-directory: AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111/pyproject.toml

      - name: Install AVIC Core and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile package
        run: python -m compileall -q avic_core

      - name: Prepare test report directory
        run: python -c "from pathlib import Path; Path('test-results').mkdir(exist_ok=True)"

      - name: Run full test suite
        run: python -m pytest -q -rs --junitxml=test-results/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avic-test-report-${{ runner.os }}-py${{ matrix.python-version }}
          path: AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111/test-results/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  rust-communication-pilot:
    name: Rust Communication Engine / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    defaults:
      run:
        working-directory: AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python for comparative benchmark
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AVIC Core
        run: python -m pip install -e .

      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/avic-communication-engine/Cargo.toml

      - name: Run same-simulator Python vs Rust Modbus benchmark (10,000 points)
        run: python tools/modbus_load_compare.py --devices 100 --points-per-device 100 --cycles 10 --concurrency 16

      - name: Run Python BACnet/IP ReadProperty baseline (10,000 points)
        run: python tools/bacnet_load_baseline.py --points 10000

  c-libmodbus-worker-linux:
    name: C libmodbus Worker / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install C build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libmodbus-dev libjansson-dev uuid-dev

      - name: Configure C Worker
        run: cmake -S rust/avic-communication-engine/c-worker -B build/c-modbus-worker -DCMAKE_BUILD_TYPE=Release

      - name: Build C Worker
        run: cmake --build build/c-modbus-worker --config Release --parallel 2

      - name: Set up Python for IPC smoke test
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AVIC Core test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run compiled C Worker IPC handshake test
        env:
          AVIC_C_MODBUS_WORKER: ${{ github.workspace }}/AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111/build/c-modbus-worker/avic-modbus-c-worker
        run: python -m pytest -q tests/test_c_modbus_worker_dev223.py

  c-libmodbus-worker-windows:
    name: C libmodbus Worker / Windows UCRT64
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        working-directory: AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MSYS2 UCRT64 C dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libmodbus
            mingw-w64-ucrt-x86_64-jansson

      - name: Configure Windows C Worker
        shell: msys2 {0}
        run: cmake -S rust/avic-communication-engine/c-worker -B build/c-modbus-worker -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Windows C Worker
        shell: msys2 {0}
        run: cmake --build build/c-modbus-worker --parallel 2

      - name: Set up Python for Windows IPC and protocol acceptance
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AVIC Core test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run compiled Windows C Worker IPC and Modbus simulator tests
        shell: pwsh
        env:
          AVIC_C_MODBUS_WORKER: ${{ github.workspace }}\AVIC_Core_1_0_Build_0_111_Station_Transfer_Engine_dev111\build\c-modbus-worker\avic-modbus-c-worker.exe
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          python -m pytest -q tests/test_c_modbus_worker_dev223.py
