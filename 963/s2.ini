[EXTRA]

[DYNAMICOBJECTS]
;lowest refresh rate schematics display
MinRefesh=5

[ICONS]
;alters size of icons in navigator display, default is 32
;for those with limited 'screen estate'
;SIZE=16

[COLOURS]
;colours of the comms lights
;NoComms=8355711
;CommsOn=65280
;CommsBusy=255

[DIARY]
;The interval code can be one of the following code numbers-
;0 = 5 minutes
;1 = 10 minutes
;2 = 15 minutes
;3 = 30 minutes
;4 = 1 hour
;5 = 12 hours
;6 = 1 day
RetryIntervalCode=6
;the first day that appears on the calendar display
StartDay=1

[HELP]
;If you want to alert the user when the scheduler is busy, set this to 1
ShowBackgroundActivity=1
;where to find the help file
PATH = documentation\963 DOCUMENTATION.hlp


[ALARMS]
;how many days to keep old alarms in the database
DaysToKeep=100
;set this to 1 if you want S2 to display labels of lans and sites (this may slow the system)
GetLabels=1
;the default alarm action
DefaultAction=BEEP


[Offline]
; this is a list of all the 'dummy outstations which appear in the engineering palette

[TCPIP]
;Set this to 1 to enable remote access to S2 via tcpip (This feature is currently used be Trend R&D for testing)
SOCKET=0

[IPADDRESS]
;use this section to restrict access to the 962 web server
;Set this to 1 to list IP addresses DENYED access from the web server
;Set this to 0 to list IP addresses ALLOWED access to the web server
DENYONLY=1
;Specify IP addresses here to enable/disable (0=disable, 1=enable)
;xxx.xxx.xxx.xxx=0

[TSS]
;this sets the spacing used when you arrange objects on a schematic page
XSPACE = 2
YSPACE = 2
;default values for graph chart
GraphRefresh = 10
;Always enable comms!
EnableComms=1

[TEXTFILEMANAGE]
FILETYPE=1

[WIDTH]
[LICENSE]
contactName=роман
companyName=авик
contactnumber=
faxNo=
email=
siteName=авик
siteAddress=aviceng.com
