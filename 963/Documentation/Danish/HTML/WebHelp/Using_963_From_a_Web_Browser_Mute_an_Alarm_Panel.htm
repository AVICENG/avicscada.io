<h1>Dæmpning af et Alarmpanel</h1>
<p class=Topic-Text-See-Also>Hvis en alarm forårsager tilsynekomst af et 
 alarmpanel, der er indstillet til at bippe, er det muligt at dæmpe bippet.</p>
<p class=Topic-Text-Procedure-head>Sådan dæmpes bippet:</p>
<p class=Topic-Text-Numbered-End>1&nbsp;Klik på <img src="image/mute.gif" alt="image\mute.gif" width="45px" height="45px" border="0" class="img_whs1"> på det alarmpanel, der skal dæmpes. Klikkes 
 der igen på knappen, starter bippet igen.</p>
