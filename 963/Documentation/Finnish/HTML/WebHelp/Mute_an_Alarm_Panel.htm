<h1 class=Topic-Text>Hälytyspaneelin 
 vaimentaminen</h1>

<p class=Topic-Text>Jos h&auml;lytys tuo n&auml;yt&ouml;lle h&auml;lytys&auml;&auml;nell&auml; varustetun h&auml;lytyspaneelin, voit tarvittaessa vaimentaa &auml;&auml;nen.</p>

<p class=Topic-Text-Procedure-head>H&auml;lytys&auml;&auml;nen vaimentamiseksi:</p>

<ol>
	
	<li class=kadov-p-CTopic-Text-Numbered-End><p class=Topic-Text-Numbered-End>Napsauta <img src="image/mute.gif" alt="image\mute.gif" width="45px" height="45px" border="0" class="img_whs1"> h&auml;lytyspaneelissa, jonka haluat vaimentaa.</p></li>
</ol>

<p class=Topic-Text>Painikkeen napsauttaminen uudelleen palauttaa h&auml;lytys&auml;&auml;nen.</p>
