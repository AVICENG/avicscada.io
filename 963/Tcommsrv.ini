; TCOMMSRV 32 bit communications driver initialisation file 24-10-96
;
; Although this file contains all settings for controlling the operation of the driver most
; people will not see ( or want to modify ) this file.
; Some of the settings are controlled and written to by the driver and others can be 
; directly modified by an engineer/operator.
; 
; The driver will operate in 2 mode and should autodetect between 1 & 2
; can be manually edited to override
;
; 1 normal CNC link
; 2 direct to IQ local port ( not 251 as this is actually mode 1 )

[IO]
NoLocalSite=0
MODE=1
BAUD=19200
COMM=1
USETCP=0
SERIALPORTSERVER=xxx.xxx.xxx.xxx
SOCKETFROM=10005
SOCKETTO=10008
;
;IQ1 series are unable to handle the same volum of data as more recent IQ2 and IQ3 series.
;To prevent communication errors appearing on the screen, settings similar to following are required.
;SameIQFrameDelay=1000
;MaxRequestsPerFrame=3
;

[NETWORK]
;IgnoreNWOK=1 is for EINC adr > 100
IgnoreNWOK=0

[Alarms]
;use these settings for receiving alarms from remote EINCs via TCP/IP
USETCP=0; set to 1 to start alarm listner
SOCKET=2774

PaperWidth=WIDE

PrintingEnabled=FALSE

; The buffer size is the maximum number of alarms that can be stored
; in the temporary buffers if printing is not available.
; By setting this to 0 then alarms are not stored and they will not be acked

BufferSize=1000			; defaults to 1000

; for serial printers we use 8 bits , no parity and one stop bit
; hardware handshaking is enabled

; Alarm printing io uses 9600 BAUD , 8 data bits , 1 stop bit , no parity
; some parameters can be changed 

OutputDevice=LPT1
BAUD=9600			; default 
;ControlCode=97			; this is sent to the printer as an escape
; sequence before each alarm is printed
; 97 works for an Amplicon panel printer to invert the text
StopBits=1			; defaults to 1
ColumnsAcross=80

; To specify an autodialling device to dial out on we use the type label of the device
; This only applies to networked autodialling devices. This uses char pos 9 in the
; overview comms response.

[Grouping]

; This sections describes the device list that is presented when adding an autodialled 
; site. This can be added to if a new device type becomes available.
Devices=MNC,ANC,TMN-H,XN28,TMN-E,TMN-G

TMN-G=G
MNC=T
TMN-H=D
XN28=X
TMN-E=E
ANC=x	; 'x' is anything else that isn't defined


; To block dial out from a specific device use this entry
; NoDialOut=I102
; This is to block a device at address 102 on the internetwork
; this could also L64 for a device on the local LAN at adrress 64

[ANC]
;The time in seconds to wait after last frame has passed through before
;forcing the line to be dropped - defaults to 60 seconds

IdleTimeToDropLine=40
;To avoid large telephone bills we have to limit the length of time that 
;the line is up
NumRefreshes=100

;Set this to zero to stop regular polling of modem status's
;Only set to zero for sites with large numbers of modems
PollModems=1
;Interval, in S, between modem polling
PollingInterval=30


[TIMEOUTS]
;In mS!
;For the local site, the value is trimmed up and down between 2 limits
;This allows tcommsrv to compensate for prevailing network conditions
LocalSite=5000
MaxLocalSite=20000
MinLocalSite=4000
RemoteATDSites=30000 ;general setting for autodialed (modem) sites
RemoteTCPSites=30000 ;general setting for TCP connected sites

;to specify an individual controller timeout use format [tele]L[lan]O[os], eg 6520L21O24=45000


[RETRIES]
;number of retries tcommsrv will make for each message type
;can change these to cope with problem sites
LocalSite=1
RemoteSites=1
ConditionalTextComms=1

;Following sections are for remote TCP/IP sites
[TCPIDLETIMES]
;In seconds
;for each IP address specify an idle time before connection is dropped
;default is 120s

[STARTSOCKET]
;For remote TCP connected sites

[ENDSOCKET]
;For remote TCP connected sites

[IpMacLookup]
; used to lookup EINC IP address from it's MAC address

[FirewallLookup]
;used to convert from site IP to firewall IP
;171.192.2.11=171.121.232.233:10001 will redirect all requests to 171.192.2.11 to 171.121.232.233, port 10001