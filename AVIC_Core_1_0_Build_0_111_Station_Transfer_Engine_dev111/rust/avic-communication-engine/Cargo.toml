[package]
name = "avic-communication-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AVIC multi-protocol communication engine and Driver SDK worker kernel"

[lib]
name = "avic_communication_engine"
path = "src/lib.rs"

[[bin]]
name = "avic-modbus-bench"
path = "src/bin/avic_modbus_bench.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde"] }

# Protocol stacks are pinned to reviewed versions. BACnet-RS is currently
# experimental upstream; AVIC acceptance tests remain mandatory before field use.
bacnet-rs = "=0.3.2"
knxide = "=0.1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "time"] }
