  <circle class="ahu-bolt" cx="86" cy="103" r="2.1"/><circle class="ahu-bolt" cx="86" cy="126" r="2.1"/><circle class="ahu-bolt" cx="86" cy="151" r="2.1"/><circle class="ahu-bolt" cx="86" cy="181" r="2.1"/><circle class="ahu-bolt" cx="86" cy="198" r="2.1"/><circle class="ahu-bolt" cx="298" cy="103" r="2.1"/><circle class="ahu-bolt" cx="298" cy="126" r="2.1"/><circle class="ahu-bolt" cx="298" cy="151" r="2.1"/><circle class="ahu-bolt" cx="298" cy="181" r="2.1"/><circle class="ahu-bolt" cx="298" cy="198" r="2.1"/>
